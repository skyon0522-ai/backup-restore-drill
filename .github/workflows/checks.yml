name: Verify copied source and synthetic restore drill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-local-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ runner.temp }}/backup-drill-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Select the recorded Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run the actual Linux entrypoint
        run: python3 tools/run_drill.py "$RUNNER_TEMP/backup-drill"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-drill-review
          path: ${{ runner.temp }}/backup-drill/review
          retention-days: 7
          if-no-files-found: warn
